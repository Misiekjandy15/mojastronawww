<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel logowania do strony z ciekawostkami o sztucznej inteligencji.">
  <title>Panel logowania</title>
  <link rel="stylesheet" href="loginpanel.css"> <!-- Pobieranie stylów z loginpanel.css -->

  <script>
    // Funkcja obsługująca logowanie
    function handleLogin(event) {
      event.preventDefault();

      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      // Wysłanie danych do backendu
      fetch('http://localhost:5000/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          username: username,
          password: password
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          sessionStorage.setItem('loggedIn', 'true');
          window.location.href = 'index.html';
        } else {
          alert(data.message || 'Nieprawidłowa nazwa użytkownika lub hasło!');
        }
      })
      .catch(error => {
        console.error('Błąd:', error);
        alert('Błąd podczas logowania. Upewnij się, że serwer backend jest uruchomiony na http://localhost:5000');
      });
    }

    // Funkcja pokazująca lub ukrywająca hasło
    function togglePassword() {
      var passwordField = document.getElementById('password');
      var type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
    }

    // Sprawdzenie, czy użytkownik jest już zalogowany
    window.onload = function() {
      if (sessionStorage.getItem('loggedIn') === 'true') {
        window.location.href = 'index.html';
      }
    }
  </script>
</head>
<body>
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div id="login-container">
    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
      <h2><center>Zaloguj Się</center></h2>

      <label for="username">Nazwa użytkownika:</label>
      <input type="text" id="username" name="username" autocomplete="off" required>

      <label for="password">Hasło:</label>
      <div class="password-container">
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>
      
      <button type="submit">Zaloguj się</button>
      
      <hr>
      <button type="button" class="register-button" onclick="window.location.href='przyciskrejstracji.html'">Zarejestruj się</button>
    </form>
  </div>
</body>
</html>
